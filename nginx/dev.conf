events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream aspire_server {
        server server:8000;
    }

    upstream aspire_flower {
        server flower:5555;
    }

    upstream aspire_rabbitmq {
        server rabbitmq:15672;
    }

    upstream aspire_minio_console {
        server minio:9001;
    }

    upstream aspire_minio_api {
        server minio:9000;
    }

    server {
        listen 8080;
        server_name localhost;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /static/ {
            alias /var/www/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://aspire_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /flower/ {
            proxy_pass http://aspire_flower;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Script-Name /flower;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /rabbitmq/ {
            auth_basic "ASPIRE Admin";
            auth_basic_user_file /etc/nginx/htpasswd;
            rewrite ^/rabbitmq/(.*)$ /$1 break;
            proxy_pass http://aspire_rabbitmq;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /rabbitmq/api/ {
            auth_basic "ASPIRE Admin";
            auth_basic_user_file /etc/nginx/htpasswd;
            rewrite ^/rabbitmq/(.*)$ /$1 break;
            proxy_pass http://aspire_rabbitmq;
            proxy_set_header Host $host;
        }

        location /minio/ {
            auth_basic "ASPIRE Admin";
            auth_basic_user_file /etc/nginx/htpasswd;
            rewrite ^/minio/(.*)$ /$1 break;
            proxy_pass http://aspire_minio_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /minio-api/ {
            auth_basic "ASPIRE Admin";
            auth_basic_user_file /etc/nginx/htpasswd;
            rewrite ^/minio-api/(.*)$ /$1 break;
            proxy_pass http://aspire_minio_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
