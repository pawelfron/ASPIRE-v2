{% extends "base/core.html" %}

{% block title %} Account - ASPIRE {% endblock %}

{% block header-text %} Account details {% endblock %}
{% block header-actions %}
<a href="{% url 'password_change' %}" class="btn btn-neutral">Change password</a>
<a href="{% url 'user_delete' user.id %}" class="btn btn-error">Delete account</a>
{% endblock %}

{% block content %}
<div class="text-center">
  <p class="mb-3">Email: <span class="badge badge-ghost">{{ user }}</span></p>
</div>
{% endblock %}
