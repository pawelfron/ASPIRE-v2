{% extends 'base/core.html' %}

{% block title %} Delete run - ASPIRE {% endblock %}

{% block header-text %} Delete run {% endblock %}

{% block content %}
<form method="post" class="block text-center">
  {% csrf_token %}

  <p class="font-bold mb-5">Are you sure you want to delete this run?</p>

  <a href="{% url 'retrieval_run_detail' run.id %}" class="btn btn-ghost">Cancel</a>
  <input type="submit" value="Delete" class="btn btn-error" />
</form>
{% endblock %}
