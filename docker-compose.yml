services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - NGINX_ADMIN_USER=${NGINX_ADMIN_USER:-admin}
      - NGINX_ADMIN_PASS=${NGINX_ADMIN_PASS:-admin}
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/40-aspire-setup.sh:/docker-entrypoint.d/40-aspire-setup.sh:ro
      - static_data:/var/www/static:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      server:
        condition: service_healthy
      flower:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aspire_db
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aspire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Docker Hub minio/minio was removed; use Quay (last published community image).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-https://localhost/minio}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis_sessions:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_results:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flower:
    build: .
    restart: unless-stopped
    entrypoint: ["celery"]
    command:
      - -A
      - aspire_v2
      - flower
      - --port=5555
      - --basic-auth=${FLOWER_USER}:${FLOWER_PASS}
      - --url-prefix=/flower
    env_file: ".env"
    environment:
      - MODE=PROD
    user: "1000:1000"
    depends_on:
      redis_results:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -u \"$${FLOWER_USER}:$${FLOWER_PASS}\" http://localhost:5555/flower/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  server:
    build: .
    restart: unless-stopped
    env_file: ".env"
    environment:
      - MODE=PROD
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    volumes:
      - static_data:/app/src/aspire_v2/staticfiles
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis_sessions:
        condition: service_healthy
      redis_results:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build: .
    restart: unless-stopped
    entrypoint: ["celery"]
    user: "1000:1000"
    command:
      - -A
      - aspire_v2
      - worker
      - -l
      - INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    env_file: ".env"
    environment:
      - MODE=PROD
    stop_grace_period: 120s
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis_results:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  db_data:
  minio_data:
  static_data:
  certbot_www:
  certbot_certs:
